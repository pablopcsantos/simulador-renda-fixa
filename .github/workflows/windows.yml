name: Compilar versão Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Preparar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache do Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Instalar dependências do frontend
        run: npm install

      - name: Verificar código
        run: npm run check

      - name: Compilar aplicativo Tauri
        run: npm run tauri build

      - name: Disponibilizar executável
        uses: actions/upload-artifact@v4
        with:
          name: SimuladorRendaFixa-Windows-x64
          path: src-tauri/target/release/simulador-renda-fixa.exe
          if-no-files-found: error
          retention-days: 30
